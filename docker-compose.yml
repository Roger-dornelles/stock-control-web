services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: stock-control-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
